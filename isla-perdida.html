<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isla Perdida - Supervivencia</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1a0f;color:#e0ffe0;font-family:'Segoe UI',sans-serif;overflow:hidden}
  #game{display:block;margin:0 auto;background:#1a3d1f;cursor:crosshair}
  #ui{position:absolute;top:10px;left:10px;background:rgba(0,20,10,0.85);padding:12px;border-radius:12px;border:1px solid #2a6a3a;min-width:220px}
  .stat{margin:6px 0;display:flex;align-items:center;gap:8px;font-size:13px}
  .bar{flex:1;height:10px;background:#111;border-radius:5px;overflow:hidden}
  .fill{height:100%;transition:width .3s}
  #inv{position:absolute;top:10px;right:10px;background:rgba(0,20,10,0.85);padding:12px;border-radius:12px;border:1px solid #2a6a3a;min-width:180px}
  .slot{padding:4px 8px;background:#122912;margin:3px 0;border-radius:6px;font-size:12px;display:flex;justify-content:space-between}
  #msg{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:8px 16px;border-radius:20px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s}
  h3{font-size:14px;margin-bottom:8px;color:#7CFC7C}
  button{background:#2a6a3a;color:white;border:none;padding:6px 10px;border-radius:6px;margin:2px;cursor:pointer;font-size:11px}
  button:hover{background:#3a8a4a}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <h3>🏝️ ISLA PERDIDA</h3>
  <div class="stat">❤️ Vida <div class="bar"><div id="hp" class="fill" style="background:#ff4444;width:100%"></div></div><span id="hpT">100</span></div>
  <div class="stat">🍖 Hambre <div class="bar"><div id="hunger" class="fill" style="background:#ffaa22;width:80%"></div></div><span id="hunT">80</span></div>
  <div class="stat">💧 Sed <div class="bar"><div id="thirst" class="fill" style="background:#44aaff;width:80%"></div></div><span id="thiT">80</span></div>
  <div class="stat">⚡ Energía <div class="bar"><div id="energy" class="fill" style="background:#ffff44;width:100%"></div></div><span id="eneT">100</span></div>
  <div style="margin-top:10px;font-size:11px;opacity:.8">WASD mover • E recolectar • C craftear refugio (20 madera)<br>Día: <span id="day">1</span> • Madera: <span id="woodC">0</span></div>
  <div style="margin-top:8px">
    <button onclick="craft('fuego')">🔥 Fogata (10 madera, 5 piedra)</button>
    <button onclick="craft('refugio')">🏠 Refugio (20 madera)</button>
  </div>
</div>
<div id="inv"><h3>🎒 Inventario</h3><div id="invList"></div><div style="margin-top:8px;font-size:11px">Piedra: <span id="stoneC">0</span> | Bayas: <span id="berryC">0</span></div></div>
<div id="msg"></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener('resize',resize);
let player={x:0,y:0,hp:100,hunger:80,thirst:80,energy:100,wood:0,stone:0,berries:5};
let world=[],day=1,time=0,hasShelter=false,hasFire=false,fireTime=0;
let keys={},msgTimer=0;
function showMsg(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msgTimer);msgTimer=setTimeout(()=>m.style.opacity=0,2500)}
function genWorld(){
  world=[];
  for(let i=0;i<70;i++) world.push({type:'tree',x:(Math.random()-0.5)*2000,y:(Math.random()-0.5)*2000,hp:3});
  for(let i=0;i<50;i++) world.push({type:'rock',x:(Math.random()-0.5)*2000,y:(Math.random()-0.5)*2000,hp:2});
  for(let i=0;i<60;i++) world.push({type:'berry',x:(Math.random()-0.5)*2000,y:(Math.random()-0.5)*2000});
  for(let i=0;i<5;i++) world.push({type:'water',x:(Math.random()-0.5)*1800,y:(Math.random()-0.5)*1800});
}
genWorld();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()=='e') interact();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function interact(){
  let closest=null,dmin=80;
  for(let o of world){let d=Math.hypot(o.x-player.x,o.y-player.y);if(d<dmin){dmin=d;closest=o}}
  if(!closest){showMsg('Nada cerca');return}
  if(closest.type=='tree'){closest.hp--;player.wood+=2;player.energy-=3;showMsg('+2 Madera 🪵');if(closest.hp<=0) world.splice(world.indexOf(closest),1)}
  else if(closest.type=='rock'){closest.hp--;player.stone+=1;player.energy-=4;showMsg('+1 Piedra 🪨');if(closest.hp<=0) world.splice(world.indexOf(closest),1)}
  else if(closest.type=='berry'){player.berries++;player.hunger=Math.min(100,player.hunger+15);world.splice(world.indexOf(closest),1);showMsg('¡Bayas! +15 hambre 🫐'); if(Math.random()<0.3){world.push({type:'berry',x:(Math.random()-0.5)*2000,y:(Math.random()-0.5)*2000})}}
  else if(closest.type=='water'){player.thirst=Math.min(100,player.thirst+30);player.energy-=2;showMsg('Bebiste agua 💧')}
}
function craft(type){
  if(type=='fuego' && player.wood>=10 && player.stone>=5){player.wood-=10;player.stone-=5;hasFire=true;fireTime=600;world.push({type:'fire',x:player.x+40,y:player.y});showMsg('¡Fogata creada! Te protege de noche')}
  else if(type=='refugio' && player.wood>=20){player.wood-=20;hasShelter=true;showMsg('¡Refugio construido! Regenera vida');world.push({type:'shelter',x:player.x-60,y:player.y})}
  else showMsg('Recursos insuficientes');
}
function update(){
  let speed=3.5;
  if(keys['w']) player.y-=speed;
  if(keys['s']) player.y+=speed;
  if(keys['a']) player.x-=speed;
  if(keys['d']) player.x+=speed;
  time+=0.01; if(time>100){time=0;day++; if(day%2==0) genWorld();}
  // stats decay
  player.hunger-=0.03; player.thirst-=0.04; player.energy-=0.01;
  if(player.hunger<=0||player.thirst<=0) player.hp-=0.1;
  if(hasShelter && Math.hypot(player.x-(world.find(o=>o.type=='shelter')?.x||9999), player.y-(world.find(o=>o.type=='shelter')?.y||9999))<100) {player.hp=Math.min(100,player.hp+0.05); player.energy=Math.min(100,player.energy+0.08)}
  if(player.energy<=0) speed=1;
  if(player.hp<=0){alert('Moriste en la isla. Sobreviviste '+day+' días. ¡Reintentando!');player={x:0,y:0,hp:100,hunger:80,thirst:80,energy:100,wood:0,stone:0,berries:5};day=1;hasShelter=false;hasFire=false;genWorld();}
  player.hunger=Math.max(0,player.hunger); player.thirst=Math.max(0,player.thirst); player.energy=Math.max(0,Math.min(100,player.energy)); player.hp=Math.max(0,Math.min(100,player.hp));
  // UI
  document.getElementById('hp').style.width=player.hp+'%'; document.getElementById('hpT').textContent=Math.floor(player.hp);
  document.getElementById('hunger').style.width=player.hunger+'%'; document.getElementById('hunT').textContent=Math.floor(player.hunger);
  document.getElementById('thirst').style.width=player.thirst+'%'; document.getElementById('thiT').textContent=Math.floor(player.thirst);
  document.getElementById('energy').style.width=player.energy+'%'; document.getElementById('eneT').textContent=Math.floor(player.energy);
  document.getElementById('day').textContent=day; document.getElementById('woodC').textContent=player.wood; document.getElementById('stoneC').textContent=player.stone; document.getElementById('berryC').textContent=player.berries;
  document.getElementById('invList').innerHTML=`<div class="slot"><span>🪵 Madera</span><span>${player.wood}</span></div><div class="slot"><span>🪨 Piedra</span><span>${player.stone}</span></div><div class="slot"><span>🫐 Bayas</span><span>${player.berries}</span></div>`;
  if(player.berries>0 && keys['q']){player.berries--;player.hunger=Math.min(100,player.hunger+20);showMsg('Comiste bayas')}
}
function draw(){
  ctx.fillStyle=time>50?'#0a1a2a':'#1a4d2a'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.translate(canvas.width/2-player.x, canvas.height/2-player.y);
  // ground texture
  ctx.fillStyle='#2a5a2a'; for(let x=-2000;x<2000;x+=100) for(let y=-2000;y<2000;y+=100){ctx.fillRect(x+Math.sin(x)*10,y,90,90)}
  for(let o of world){
    if(o.type=='tree'){ctx.fillStyle='#5d3a1a';ctx.fillRect(o.x-8,o.y-10,16,30);ctx.fillStyle='#1a6a1a';ctx.beginPath();ctx.arc(o.x,o.y-20,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2a8a2a';ctx.beginPath();ctx.arc(o.x-5,o.y-25,18,0,Math.PI*2);ctx.fill();}
    else if(o.type=='rock'){ctx.fillStyle='#666';ctx.beginPath();ctx.arc(o.x,o.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#888';ctx.beginPath();ctx.arc(o.x-4,o.y-4,8,0,Math.PI*2);ctx.fill();}
    else if(o.type=='berry'){ctx.fillStyle='#aa2244';ctx.beginPath();ctx.arc(o.x,o.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#22aa44';ctx.fillRect(o.x-2,o.y-12,4,8)}
    else if(o.type=='water'){ctx.fillStyle='#2244aa';ctx.beginPath();ctx.arc(o.x,o.y,40,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4466ff';ctx.beginPath();ctx.arc(o.x,o.y,30,0,Math.PI*2);ctx.fill();}
    else if(o.type=='fire'){ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(o.x,o.y,12+Math.random()*6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(o.x,o.y,6,0,Math.PI*2);ctx.fill();}
    else if(o.type=='shelter'){ctx.fillStyle='#8a5a2a';ctx.fillRect(o.x-30,o.y-20,60,40);ctx.fillStyle='#5a3a1a';ctx.beginPath();ctx.moveTo(o.x-35,o.y-20);ctx.lineTo(o.x,o.y-45);ctx.lineTo(o.x+35,o.y-20);ctx.fill();}
  }
  // player
  ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(player.x,player.y,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2244aa';ctx.fillRect(player.x-10,player.y+8,20,14);ctx.fillStyle='#ffdbac';ctx.fillRect(player.x-14,player.y+2,6,12);ctx.fillRect(player.x+8,player.y+2,6,12);
  ctx.restore();
  // vignette night
  if(time>60){ctx.fillStyle=`rgba(0,0,40,${(time-60)/80})`;ctx.fillRect(0,0,canvas.width,canvas.height); if(!hasFire) {ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,canvas.width,canvas.height);}}
}
function loop(){update();draw();requestAnimationFrame(loop)} loop();
</script>
</body>
</html>
